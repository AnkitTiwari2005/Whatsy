<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07070a">
<title>Whatsy Admin</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<!-- Sign in -->
<section class="login" id="login" aria-labelledby="login-h">
  <div class="login-card">
    <img src="logo-wide.png" alt="Whatsy" width="176" height="44">
    <p class="sub" id="login-h">Admin Console</p>
    <div class="fg">
      <label for="lk">Admin key</label>
      <div class="pw">
        <input id="lk" type="password" autocomplete="current-password" placeholder="Paste your admin key" spellcheck="false" autocapitalize="off" aria-describedby="lk-err">
        <button class="eye" type="button" id="lk-eye" aria-label="Show admin key" aria-pressed="false"></button>
      </div>
      <div id="lk-err" class="hint" role="alert" aria-live="assertive"></div>
    </div>
    <button class="btn p block" id="lk-go" type="button">Sign in</button>
    <p class="hint mt" style="text-align:center">The key is kept in this tab only and cleared when you close it.</p>
  </div>
</section>

<!-- App -->
<div class="shell" id="app" hidden>
  <aside class="side" id="side" aria-label="Sidebar">
    <div class="brand"><img src="logo-mark.png" alt="" width="30" height="27"><div><b>Whatsy</b><small>Admin panel</small></div></div>
    <a class="conn" href="#/pair" id="conn" aria-live="polite"><span class="dot offline" id="conn-dot"></span><span><b id="conn-l">Connecting…</b><small id="conn-s">Checking status</small></span></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot"><button class="btn gh block" id="logout" type="button">Sign out</button><small>Whatsy admin · v2</small></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <header class="top"><button class="btn gh icon-btn" id="burger" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false"></button><img src="logo-wide.png" alt="Whatsy" height="26"><span class="grow"></span><span class="dot offline" id="top-dot" title="WhatsApp status"></span></header>
    <main class="main" id="view" tabindex="-1" aria-live="off"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<noscript><p style="padding:24px;color:#fff">The Whatsy admin console needs JavaScript.</p></noscript>
<script src="admin.js"></script>
</body>
</html>
